<!doctype html>
<!-- Mockup, 2026-11-18: the class card for the grades page (overlays/grades.js),
     after Owen found the summary line flat ("doesn't feel satisfying"). Idea
     taken from gunn.one: one big number you watch, and scores you can always
     type into, with no What-if mode to turn on first.
     One in: a card under each class's title, sticky while you scroll that
     class, letting go at the next one. One out: the summary line, the What-if
     pill and mode, the bottom bar and Show real.
     It works: click any score (or a "—") and type; Enter or click away keeps
     it, Esc puts it back. Serve the repo root and open
     /docs/extension/design/class-card.html. Not wired to anything.
     Built 2026-11-18 as drawn, except a tried score shows as "→ 12" beside
     Schoology's own (which we don't rewrite), not in place of it. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class card</title>
<style>
@font-face { font-family: "Instrument Sans"; font-weight: 400; src: url(../../../extension/overlays/fonts/instrument-sans-latin-400.woff2) format("woff2"); }
@font-face { font-family: "Instrument Sans"; font-weight: 500; src: url(../../../extension/overlays/fonts/instrument-sans-latin-500.woff2) format("woff2"); }
@font-face { font-family: "Instrument Sans"; font-weight: 600 800; src: url(../../../extension/overlays/fonts/instrument-sans-latin-600.woff2) format("woff2"); }
:root {
  color-scheme: light;
  --accent: #1D5EA8; --accent-soft: #E7EFF8;
  --ink: #1F2429; --dim: #5E6670; --faint: #8A929B;
  --line: #DCE0E5; --sunk: #F6F7F9; --surface: #FFFFFF;
  --bad: #B8430F;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --radius: 8px; --radius-sm: 6px;
}
* { box-sizing: border-box; }
body { margin: 0; background: #E9ECEF; color: var(--ink); font: 13px/18px var(--sans); padding-inline: 16px; padding-block: 16px 60vh; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Mockup controls (not part of the design) ── */
.top { max-width: 1040px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.top h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
.top p { margin: 0; color: var(--dim); font-size: 12px; flex-basis: 100%; max-width: 90ch; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 2px; }
.seg button { padding: 4px 10px; border-radius: var(--radius-sm); color: var(--dim); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 22px; }
.wrap > * { min-width: 0; }
body.narrow .wrap { max-width: 640px; }

/* ── Schoology's /grades/grades, roughly ── */
.sgy { background: #fff; border-radius: 4px; font: 13px/1.4 Arial, sans-serif; color: #333; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.ctitle { padding: 10px 14px; font-weight: bold; font-size: 14px; color: #0677BA; border-bottom: 1px solid #e3e3e3; background: #fafafa; border-radius: 4px 4px 0 0; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 540px; }
td { padding: 9px 10px; border-bottom: 1px solid #ececec; vertical-align: middle; }
td.t { width: 50%; }
td.g { white-space: nowrap; }
td.ours { width: 170px; text-align: right; padding-right: 14px; }
tr.period td { font-weight: bold; background: #f7f7f7; }
tr.cat td.t { padding-left: 26px; font-weight: bold; }
tr.item td.t { padding-left: 44px; }
tr.item td.t a { color: #0677BA; text-decoration: none; }
tr.item td.t small { display: block; color: #888; font-size: 11px; }
.sgrade { color: #3B7A1E; font-weight: bold; }

/* ── Dewey: the class card ── */
.card {
  position: sticky; top: 0; z-index: 2;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px;
  padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
  font-family: var(--sans); color: var(--ink);
  transition: background-color .15s, box-shadow .15s;
}
.card.stuck { box-shadow: 0 4px 12px rgba(20, 30, 40, .10); }
.card.changed { background: var(--accent-soft); }
.big { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.big .was { color: var(--faint); font-size: 15px; }
.big .num { font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; }
.big .num small { font-size: 18px; font-weight: 500; }
.changed .big .num { color: var(--accent); }
.big .let { font-size: 15px; font-weight: 600; color: var(--dim); }
.changed .big .let { color: var(--accent); }
.gap { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; }
.gap b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
select.goal { font: 500 12px/1 var(--sans); height: 26px; padding: 0 6px 0 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--dim); cursor: pointer; }
.end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); font-weight: 500; background: var(--surface); white-space: nowrap; }
.pill:hover { color: var(--ink); border-color: var(--faint); }
.pill.on { border-color: var(--accent); color: var(--accent); }
.pill.reset { border-color: var(--accent); color: var(--accent); }
.pill svg { display: block; }

.chartbox { padding: 4px 16px 12px; border-bottom: 1px solid var(--line); font-family: var(--sans); }
.chartbox svg { display: block; width: 100%; max-width: 640px; height: auto; }

/* ── Dewey: scores you can always type into ── */
.score { display: inline-block; border-radius: 4px; padding: 2px 4px; margin: -2px -4px; cursor: text; }
.score:hover { background: var(--accent-soft); box-shadow: inset 0 -1px 0 var(--accent); }
.score s { color: #999; margin-right: 4px; }
.score .wi { color: var(--accent); font-family: var(--sans); font-weight: 600; }
.score small { color: #777; }
.left .score > span:first-child { text-decoration: line-through; color: #aaa; }
.box { display: inline-flex; align-items: center; gap: 4px; font-family: var(--sans); }
.box input { width: 52px; height: 26px; padding: 0 6px; border: 1px solid var(--accent); border-radius: var(--radius-sm); font: 500 13px var(--sans); font-variant-numeric: tabular-nums; color: var(--ink); background: #fff; }
.box input:focus { outline: 2px solid var(--accent-soft); }
.box .of { color: var(--dim); }
.leave { margin-left: 8px; color: var(--dim); font: 12px var(--sans); text-decoration: underline; text-underline-offset: 2px; }
.pct { color: var(--faint); font: 11px var(--sans); font-variant-numeric: tabular-nums; margin-left: 6px; }
tr.mark td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.dw { font: 12px/16px var(--sans); color: var(--dim); font-variant-numeric: tabular-nums; }
.dw.acc { color: var(--accent); }
.to { color: var(--accent); font: 500 12px var(--sans); margin-left: 6px; }
.add { margin-left: 10px; color: var(--accent); font: 500 12px var(--sans); }
.add:hover { text-decoration: underline; }
tr.plan td { background: #fcfcfd; font-family: var(--sans); font-size: 12px; }
tr.plan input { width: 52px; height: 26px; padding: 0 6px; border: 1px solid var(--line); border-radius: var(--radius-sm); font: 500 13px var(--sans); }
tr.plan input.name { width: 150px; }
tr.plan .lbl { color: var(--dim); margin: 0 4px 0 10px; }
</style></head>
<body>
<div class="top">
  <h1>Class card</h1>
  <div class="seg" role="group" aria-label="Window width">
    <button type="button" aria-pressed="true" data-w="wide">Wide window</button>
    <button type="button" aria-pressed="false" data-w="narrow">Laptop half-screen</button>
  </div>
  <p>Click any score and type. Scroll down: the card sticks while you're in that class and hands off at the next one.</p>
</div>
<div class="wrap" id="wrap"></div>

<script>
const SCALE = [[97,'A+'],[93,'A'],[90,'A-'],[87,'B+'],[83,'B'],[80,'B-'],[77,'C+'],[73,'C'],[70,'C-'],[67,'D+'],[63,'D'],[60,'D-'],[0,'F']];
const GOALS = SCALE.filter(([c]) => c >= 70 && c < 97);
const letter = (p) => SCALE.find(([c]) => p >= c)[1];
const fmt = (n) => n.toFixed(2);
const GRAPH = `<svg width="28" height="12" viewBox="0 0 28 12" aria-hidden="true"><path d="M1,7 H7 V9 H12 V4 H19 V3 H24 V5 H27" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;

const CLASSES = [
  { name: 'AP Biology: RiveraM p2', period: '26-27 T1', goal: 93, cats: [
    { title: 'Labs & Homework', weight: 30, items: [
      ['Lab Safety Contract', '2026-08-17', 10, 10], ['Syllabus Quiz', '2026-08-18', 5, 5],
      ['Lab 1.1 Measuring pH', '2026-08-26', 19, 20], ['Problem Set 1', '2026-09-02', 10, 10],
      ['Lab 1.2 Enzymes', '2026-09-10', 18, 20], ['Lab 2.1 Diffusion', '2026-10-01', 17, 20],
      ['Problem Set 2', '2026-11-20', null, 10]] },
    { title: 'Tests & Quizzes', weight: 70, items: [
      ['Unit 1 Quiz', '2026-09-04', 18, 20], ['Unit 1 Test', '2026-09-17', 46, 50],
      ['Unit 2 Quiz', '2026-10-09', 20, 20], ['Unit 2 Test', '2026-11-24', null, 50]] }] },
  { name: 'AP Physics 1', period: '26-27 T1', goal: 90, cats: [
    { title: 'Homework', weight: 20, items: [
      ['HW 1 Kinematics', '2026-08-21', 10, 10], ['HW 2 Vectors', '2026-09-03', 9, 10],
      ['HW 3 Forces', '2026-09-24', 10, 10], ['HW 4 Energy', '2026-11-19', null, 10]] },
    { title: 'Labs', weight: 30, items: [
      ['Lab: Free Fall', '2026-09-01', 24, 25], ['Lab: Atwood Machine', '2026-10-06', 22, 25]] },
    { title: 'Tests', weight: 50, items: [
      ['Unit 1 Test', '2026-09-12', 41, 50], ['Unit 2 Test', '2026-10-16', 44, 50]] }] },
];
let uid = 0;
for (const c of CLASSES) {
  c.plans = [];
  for (const k of c.cats) k.items = k.items.map(([t, due, e, p]) => ({ id: ++uid, t, due, e, p, cat: k.title }));
}
// What-if state, per page view: id → number; left out: Set of ids.
const wi = new Map(), left = new Set();

function grade(c, { real = false, skip = null } = {}) {
  let W = 0, S = 0;
  for (const k of c.cats) {
    let e = 0, p = 0;
    for (const it of k.items) {
      if (it.id === skip || (!real && left.has(it.id))) continue;
      const v = !real && wi.has(it.id) ? wi.get(it.id) : it.e;
      if (v == null) continue;
      e += v; p += it.p;
    }
    if (!real) for (const pl of c.plans) if (pl.cat === k.title && pl.score != null && pl.worth) { e += pl.score; p += pl.worth; }
    if (p > 0) { W += k.weight; S += k.weight * (e / p) * 100; }
  }
  return W ? S / W : null;
}
const changes = (c) => c.cats.flatMap((k) => k.items).filter((it) => wi.has(it.id) || left.has(it.id)).length + c.plans.filter((p) => p.score != null).length;
function needFor(c, pl) {
  const at = (s) => { const keep = pl.score; pl.score = s; const g = grade(c); pl.score = keep; return g; };
  const lo = at(0), hi = at(pl.worth);
  if (lo >= c.goal) return 'any score keeps ' + letter(c.goal);
  if (hi < c.goal) return 'out of reach with this alone';
  return `need ${Math.ceil(pl.worth * (c.goal - lo) / (hi - lo))}/${pl.worth} for ${/^[AEFIO]/.test(letter(c.goal)) ? 'an' : 'a'} ${letter(c.goal)}`;
}

function chart(c) {
  const items = c.cats.flatMap((k) => k.items).filter((it) => it.e != null).sort((a, b) => a.due.localeCompare(b.due));
  const pts = []; const shown = new Set();
  for (const it of items) {
    shown.add(it.id);
    const sub = { ...c, plans: [], cats: c.cats.map((k) => ({ ...k, items: k.items.filter((x) => shown.has(x.id)) })) };
    pts.push({ day: it.due, pct: grade(sub, { real: true }) });
  }
  const proj = changes(c) ? grade(c) : null;
  const w = 600, h = 150, m = { l: 34, r: 70, t: 10, b: 22 };
  const d = (s) => Date.parse(s) / 864e5;
  const x0 = d(pts[0].day), xe = d('2026-11-18'), x1 = proj != null ? xe + 8 : xe;
  const vals = pts.map((p) => p.pct).concat(proj ?? []);
  const lo = Math.min(c.goal - 1, Math.floor(Math.min(...vals)) - 1), hi = Math.max(100, Math.ceil(Math.max(...vals)));
  const X = (n) => m.l + (n - x0) / (x1 - x0) * (w - m.l - m.r), Y = (v) => m.t + (hi - v) / (hi - lo) * (h - m.t - m.b);
  let g = '';
  const step = (hi - lo) <= 12 ? 2 : 5;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) g += `<line x1="${m.l}" x2="${w - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--sunk)"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--faint)">${v}</text>`;
  g += `<line x1="${m.l}" x2="${w - m.r}" y1="${Y(c.goal)}" y2="${Y(c.goal)}" stroke="var(--dim)" stroke-dasharray="3 3"/><text x="${w - m.r + 6}" y="${Y(c.goal) + 4}" font-size="11" fill="var(--dim)">${letter(c.goal)} cutoff</text>`;
  let p = `M${X(d(pts[0].day))},${Y(pts[0].pct)}`;
  for (const q of pts.slice(1)) p += ` H${X(d(q.day))} V${Y(q.pct)}`;
  p += ` H${X(xe)}`;
  const last = pts[pts.length - 1];
  g += `<path d="${p}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${X(xe)}" cy="${Y(last.pct)}" r="4" fill="var(--accent)" stroke="#fff" stroke-width="2"/>`;
  if (proj != null) g += `<path d="M${X(xe)},${Y(last.pct)} L${X(x1)},${Y(proj)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3" fill="none"/><circle cx="${X(x1)}" cy="${Y(proj)}" r="3.5" fill="var(--accent)"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" font-family="Instrument Sans, sans-serif" aria-hidden="true">${g}</svg>`;
}

let editing = null; // { c, id }

function card(c) {
  const real = grade(c, { real: true }), now = grade(c), n = changes(c);
  const diff = now - c.goal;
  const open = c.graph ? ' on' : '';
  return `<div class="card${n ? ' changed' : ''}" data-card>
    <div class="big">${n ? `<span class="was">${fmt(real)} →</span>` : ''}<span class="num">${fmt(now)}<small>%</small></span><span class="let">${letter(now)}</span></div>
    <div class="gap"><span><b>${fmt(Math.abs(diff))}</b> ${diff >= 0 ? 'above' : 'below'}</span>
      <select class="goal" aria-label="Goal" data-goal>${GOALS.map(([v, l]) => `<option value="${v}"${v === c.goal ? ' selected' : ''}>Goal ${l}</option>`).join('')}</select></div>
    <div class="end">${n ? `<button class="pill reset" type="button" data-reset>Reset ${n}</button>` : ''}
      <button class="pill${open}" type="button" data-graph aria-expanded="${!!c.graph}">${GRAPH}Graph</button></div>
  </div>${c.graph ? `<div class="chartbox">${chart(c)}</div>` : ''}`;
}

function catPct(c, k, real) {
  let e = 0, p = 0;
  for (const it of k.items) {
    if (!real && left.has(it.id)) continue;
    const v = !real && wi.has(it.id) ? wi.get(it.id) : it.e;
    if (v != null) { e += v; p += it.p; }
  }
  if (!real) for (const pl of c.plans) if (pl.cat === k.title && pl.score != null && pl.worth) { e += pl.score; p += pl.worth; }
  return p ? e / p * 100 : null;
}

function itemRow(c, it) {
  const isEd = editing && editing.id === it.id;
  const out = left.has(it.id), has = wi.has(it.id);
  let g;
  if (isEd) {
    g = `<span class="box"><input inputmode="decimal" aria-label="Score for ${it.t}" value="${has ? wi.get(it.id) : (it.e ?? '')}" data-in="${it.id}"><span class="of">/ ${it.p}</span></span><button class="leave" type="button" data-leave="${it.id}">${out ? 'Count it' : 'Leave out'}</button>`;
  } else {
    const shownScore = has ? `<s>${it.e ?? '—'}</s><span class="wi">${wi.get(it.id)}</span>` : `<span>${it.e ?? '—'}</span>`;
    const v = has ? wi.get(it.id) : it.e;
    g = `<span class="score" tabindex="0" role="button" title="Try a score" data-edit="${it.id}">${shownScore} <small>/ ${it.p}</small></span>${v != null && !out ? `<span class="pct">${Math.round(v / it.p * 100)}%</span>` : ''}`;
  }
  let right = '';
  if (out) right = `<span class="dw">left out</span>`;
  else if ((has ? wi.get(it.id) : it.e) != null) {
    const im = grade(c) - grade(c, { skip: it.id });
    right = `<span class="dw${has ? ' acc' : ''}">${im >= 0 ? '+' : '−'}${fmt(Math.abs(im))}</span>`;
  }
  return `<tr class="item${has || out ? ' mark' : ''}${out ? ' left' : ''}"><td class="t"><a href="#">${it.t}</a><small>${new Date(it.due + 'T12:00').toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit' })} 11:59pm</small></td><td class="g">${g}</td><td class="ours">${right}</td></tr>`;
}

function planRows(c, k) {
  return c.plans.map((pl, i) => pl.cat !== k.title ? '' : `<tr class="plan"><td class="t" style="padding-left:44px"><input class="name" value="${pl.name}" aria-label="Name" data-pn="${i}"></td>
    <td class="g"><span class="lbl" style="margin-left:0">worth</span><input value="${pl.worth}" data-pw="${i}" aria-label="Worth"><span class="lbl">score</span><input value="${pl.score ?? ''}" data-ps="${i}" aria-label="Score"></td>
    <td class="ours"><span class="dw">${needFor(c, pl)}</span> <button class="leave" type="button" data-prm="${i}">Remove</button></td></tr>`).join('');
}

function table(c) {
  let rows = `<tr class="period"><td class="t">${c.period}</td><td class="g"><span class="sgrade">${letter(grade(c, { real: true }))} (${fmt(grade(c, { real: true }))}%)</span></td><td class="ours"></td></tr>`;
  for (const k of c.cats) {
    const r = catPct(c, k, true), w = catPct(c, k, false);
    const moved = r != null && w != null && Math.abs(r - w) > 0.005;
    rows += `<tr class="cat"><td class="t">${k.title} (${k.weight}%)<button class="add" type="button" data-plan="${k.title}">+ Upcoming</button></td><td class="g">${fmt(r)}%${moved ? `<span class="to">→ ${w.toFixed(1)}%</span>` : ''}</td><td class="ours"></td></tr>`;
    rows += planRows(c, k);
    rows += k.items.map((it) => itemRow(c, it)).join('');
  }
  return rows;
}

const wrap = document.getElementById('wrap');
function draw() {
  wrap.innerHTML = CLASSES.map((c, i) => `<section class="sgy" data-c="${i}"><div class="ctitle">${c.name}</div>${card(c)}<div class="tablewrap"><table>${table(c)}</table></div></section>`).join('');
  stick();
}
// Live while typing: redraw everything but the box being typed in.
function refresh(ci) {
  const sec = wrap.querySelector(`[data-c="${ci}"]`), c = CLASSES[ci];
  const old = sec.querySelector('[data-card]');
  const chartOld = sec.querySelector('.chartbox');
  const tmp = document.createElement('div'); tmp.innerHTML = card(c);
  chartOld?.remove(); old.replaceWith(...tmp.children);
  const t = document.createElement('tbody'); t.innerHTML = table(c);
  const rows = sec.querySelectorAll('tr'), fresh = t.querySelectorAll('tr');
  rows.forEach((r, j) => { if (!r.querySelector('input:focus') && fresh[j]) r.replaceWith(fresh[j].cloneNode(true)); else if (fresh[j]) r.querySelector('td.ours').innerHTML = fresh[j].querySelector('td.ours').innerHTML; });
  stick();
}
const ciOf = (el) => +el.closest('[data-c]').dataset.c;
const itemOf = (c, id) => c.cats.flatMap((k) => k.items).find((it) => it.id === id);

function startEdit(el) {
  const ci = ciOf(el), id = +el.dataset.edit;
  editing = { ci, id }; draw();
  const inp = wrap.querySelector(`[data-in="${id}"]`); inp.focus(); inp.select();
}
function endEdit() { editing = null; draw(); }

wrap.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-edit]'); if (!t) return;
  if (t.dataset.edit) return startEdit(t);
  const c = CLASSES[ciOf(t)];
  if ('reset' in t.dataset) { for (const it of c.cats.flatMap((k) => k.items)) { wi.delete(it.id); left.delete(it.id); } c.plans = []; editing = null; draw(); }
  else if ('graph' in t.dataset) { c.graph = !c.graph; draw(); }
  else if (t.dataset.leave) { const id = +t.dataset.leave; left.has(id) ? left.delete(id) : left.add(id); editing = null; draw(); }
  else if (t.dataset.plan) { const kind = /test|quiz/i.test(t.dataset.plan) ? 'Upcoming test' : 'Upcoming assignment'; c.plans.push({ cat: t.dataset.plan, name: kind, worth: /test/i.test(t.dataset.plan) ? 50 : 10, score: null }); draw(); wrap.querySelector(`[data-c="${ciOf(t)}"] [data-ps="${c.plans.length - 1}"]`).focus(); }
  else if (t.dataset.prm) { c.plans.splice(+t.dataset.prm, 1); draw(); }
});
wrap.addEventListener('keydown', (e) => {
  if (e.target.dataset.edit && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); startEdit(e.target); }
  if (e.target.dataset.in) {
    if (e.key === 'Enter') endEdit();
    if (e.key === 'Escape') { wi.delete(+e.target.dataset.in); endEdit(); }
  }
});
wrap.addEventListener('input', (e) => {
  const t = e.target, ci = ciOf(t), c = CLASSES[ci];
  if (t.dataset.in) {
    const id = +t.dataset.in, it = itemOf(c, id), v = t.value.trim() === '' ? null : Number(t.value);
    if (v == null || !Number.isFinite(v) || v === it.e) wi.delete(id); else wi.set(id, v);
  }
  if (t.dataset.ps) { const pl = c.plans[+t.dataset.ps]; pl.score = t.value.trim() === '' || !Number.isFinite(+t.value) ? null : +t.value; }
  if (t.dataset.pw) { const pl = c.plans[+t.dataset.pw]; pl.worth = +t.value || 0; }
  if (t.dataset.pn) { c.plans[+t.dataset.pn].name = t.value; return; }
  refresh(ci);
});
wrap.addEventListener('change', (e) => { if (e.target.dataset.goal != null) { CLASSES[ciOf(e.target)].goal = +e.target.value; draw(); } });
wrap.addEventListener('focusout', (e) => {
  if (!e.target.dataset.in) return;
  setTimeout(() => { if (editing && !wrap.querySelector('.box input:focus') && !document.activeElement?.dataset?.leave) endEdit(); }, 0);
});

function stick() {
  for (const s of wrap.querySelectorAll('[data-c]')) {
    const cd = s.querySelector('[data-card]');
    cd.classList.toggle('stuck', s.querySelector('.ctitle').getBoundingClientRect().bottom < 0 && s.getBoundingClientRect().bottom > cd.offsetHeight + 4);
  }
}
addEventListener('scroll', stick, { passive: true });
document.querySelectorAll('[data-w]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-w]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  document.body.classList.toggle('narrow', b.dataset.w === 'narrow');
}));
draw();
</script>
</body></html>
