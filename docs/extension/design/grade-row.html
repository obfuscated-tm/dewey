<!doctype html>
<!-- Mockup, 2026-11-18: the grades page's course row (overlays/grades.js), today
     and four tidier drafts. Each draft is a class box on /grades/grades with its
     course row, a category and two items. Hover a score to see the "try a score"
     hint (clicking a score starts what-if on that row). Serve the repo root and
     open /docs/extension/design/grade-row.html. Not wired to anything. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade row drafts</title>
<style>
@font-face { font-family: "Instrument Sans"; font-weight: 400; src: url(../../../extension/overlays/fonts/instrument-sans-latin-400.woff2) format("woff2"); }
@font-face { font-family: "Instrument Sans"; font-weight: 500; src: url(../../../extension/overlays/fonts/instrument-sans-latin-500.woff2) format("woff2"); }
@font-face { font-family: "Instrument Sans"; font-weight: 600 800; src: url(../../../extension/overlays/fonts/instrument-sans-latin-600.woff2) format("woff2"); }
:root {
  color-scheme: light;
  --accent: #1D5EA8; --accent-soft: #E7EFF8;
  --ink: #1F2429; --dim: #5E6670; --faint: #8A929B;
  --line: #DCE0E5; --sunk: #F6F7F9; --surface: #FFFFFF;
  --bad: #B8430F; --bad-soft: #FBEDE5; --good: #23794A; --good-soft: #E6F3EC;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --radius: 8px; --radius-sm: 6px;
}
* { box-sizing: border-box; }
body { margin: 0; background: #E9ECEF; color: var(--ink); font: 13px/18px var(--sans); padding-inline: 16px; padding-block: 16px 48px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Mockup controls ── */
.top { max-width: 1040px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.top h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 2px; }
.seg button { padding: 4px 10px; border-radius: var(--radius-sm); color: var(--dim); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 22px; }
body.narrow .wrap { max-width: 720px; }
.label { font: 600 13px/18px var(--sans); margin: 0 0 2px; }
.why { margin: 0 0 8px; color: var(--dim); font-size: 12px; max-width: 80ch; }

/* ── Schoology's /grades/grades, roughly ── */
.sgy { background: #fff; border-radius: 4px; font: 13px/1.4 Arial, sans-serif; color: #333; box-shadow: 0 1px 2px rgba(0,0,0,.08); overflow-x: auto; }
.ctitle { padding: 10px 14px; font-weight: bold; font-size: 14px; color: #0677BA; border-bottom: 1px solid #e3e3e3; background: #fafafa; }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
td { padding: 9px 10px; border-bottom: 1px solid #ececec; vertical-align: middle; }
td.t { width: 52%; }
td.g { white-space: nowrap; }
td.ours { width: 150px; text-align: right; padding-right: 14px; }
tr.period td { font-weight: bold; background: #f7f7f7; }
tr.cat td.t { padding-left: 26px; font-weight: bold; }
tr.item td.t { padding-left: 44px; }
tr.item td.t a { color: #0677BA; text-decoration: none; }
.sgrade { color: #3B7A1E; font-weight: bold; }
.sscore { color: #333; }
.sscore small { color: #777; }

/* ── Dewey pieces ── */
.dw { font: 12px/16px var(--sans); color: var(--ink); }
.inl { display: inline-flex; align-items: center; gap: 8px; margin-left: 10px; vertical-align: middle; flex-wrap: wrap; }
.spark { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: var(--radius-sm); color: var(--accent); white-space: nowrap; }
.spark:hover { background: var(--accent-soft); }
.spark svg { display: block; }
.pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); font-weight: 500; white-space: nowrap; }
.pill:hover { background: var(--accent-soft); }
.goalchip { display: inline-flex; align-items: center; gap: 2px; height: 24px; padding: 0 8px 0 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); font-weight: 500; background: var(--surface); }
.goalchip:hover { color: var(--ink); border-color: var(--faint); }
.goalchip svg, .goallink svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2; }
.note { color: var(--accent); white-space: nowrap; }
.note b { font-weight: 500; font-variant-numeric: tabular-nums; }
.goallink { display: inline-flex; align-items: center; gap: 1px; color: var(--accent); font-weight: 600; border-bottom: 1px dashed currentColor; }
.pct { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; margin-left: 6px; }
.hold { color: var(--dim); }

/* Today: old styles */
.old .goalchip { height: auto; padding: 2px 4px; }
.old .pill { height: auto; padding: 2px 10px; }

/* Draft D: a toolbar row of our own */
tr.tools td { padding: 6px 10px 8px 26px; background: #fcfcfd; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.toolbar .sep { width: 1px; height: 16px; background: var(--line); }
.toolbar .note { margin-left: auto; }

/* The chart row (open) */
tr.chart td { padding: 8px 10px 12px 26px; }
.chartbox { max-width: 560px; }
.chartbox svg { display: block; width: 100%; height: auto; }

/* Click a score: the hint */
.score { position: relative; border-radius: 4px; padding: 1px 3px; margin: -1px -3px; cursor: pointer; }
.score:hover { background: var(--accent-soft); box-shadow: inset 0 -1px 0 var(--accent); }
.score .tip { display: none; position: absolute; right: 0; bottom: calc(100% + 6px); font: 12px/16px var(--sans); background: var(--ink); color: #fff; padding: 4px 8px; border-radius: var(--radius-sm); white-space: nowrap; }
.score:hover .tip { display: block; }
</style></head>
<body>
<div class="top">
  <h1>Grade row drafts</h1>
  <div class="seg" role="group" aria-label="Window width">
    <button type="button" aria-pressed="true" data-w="wide">Wide window</button>
    <button type="button" aria-pressed="false" data-w="narrow">Laptop half-screen</button>
  </div>
  <div class="seg" role="group" aria-label="Graph">
    <button type="button" aria-pressed="false" data-g="open">Graph open</button>
    <button type="button" aria-pressed="true" data-g="closed">Graph closed</button>
  </div>
</div>
<div class="wrap" id="wrap"></div>

<script>
const SPARK = `<svg width="56" height="16" viewBox="0 0 56 16" aria-hidden="true"><path d="M2,9 H14 V11 H22 V5 H34 V4 H44 V7 H50" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="50" cy="7" r="2.5" fill="var(--accent)"/></svg>`;
const CHART = `<svg viewBox="0 0 560 120" aria-hidden="true">
  <line x1="40" y1="88" x2="550" y2="88" stroke="var(--faint)" stroke-dasharray="4 4"/>
  <text x="34" y="92" font-size="11" text-anchor="end" fill="var(--faint)" font-family="var(--sans)">93</text>
  <text x="34" y="22" font-size="11" text-anchor="end" fill="var(--faint)" font-family="var(--sans)">100</text>
  <path d="M40,40 H140 V58 H230 V22 H360 V18 H470 V30 H550" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="550" cy="30" r="4" fill="var(--accent)"/></svg>`;
const CHEV = `<svg viewBox="0 0 10 10"><path d="M2 4l3 3 3-3"/></svg>`;
let graph = 'closed';

const grade = `<span class="sgrade">A (99.25%)</span>`;
const sparkBtn = (text) => `<button class="spark" type="button" aria-label="${graph === 'open' ? 'Hide graph' : 'Show graph'}" title="Your grade over the term">${SPARK}${text ? `<span>${text}</span>` : ''}</button>`;
const goalChip = `<button class="goalchip" type="button">Goal A ${CHEV}</button>`;
const whatIf = `<button class="pill" type="button">What-if</button>`;
const above = `<span class="note"><b>6.25</b> above A</span>`;
const aboveGoal = `<span class="note"><b>6.25</b> above <button class="goallink" type="button" title="Change your goal">A ${CHEV}</button></span>`;
const chartRow = () => graph === 'open' ? `<tr class="chart"><td colspan="3"><div class="chartbox">${CHART}</div></td></tr>` : '';

function rest(goalWord = 'A') {
  return `
  <tr class="cat"><td class="t">Labs (40%)</td><td class="g"><span class="sscore">98.10%</span></td><td class="ours dw"><span class="hold">${goalWord} holds down to 81.2%</span></td></tr>
  <tr class="item"><td class="t"><a href="#">Flame Test lab</a></td><td class="g"><span class="score" tabindex="0"><span class="sscore">19 <small>/ 20</small></span><span class="tip">Try a different score</span></span><span class="pct dw">95%</span></td><td class="ours"></td></tr>
  <tr class="item"><td class="t"><a href="#">Ch. 4 problem set</a></td><td class="g"><span class="score" tabindex="0"><span class="sscore">— <small>/ 10</small></span><span class="tip">Try a score</span></span></td><td class="ours"></td></tr>`;
}

const DRAFTS = [
  { name: 'Today', cls: 'old', why: 'Two lines in the grade cell: sparkline + "Hide graph", then Goal and What-if as two different-looking chips.',
    row: () => `<tr class="period"><td class="t">2025-2026 S1</td><td class="g">${grade}<span class="inl dw">${sparkBtn(graph === 'open' ? 'Hide graph' : 'Graph')}</span><br><span class="inl dw" style="margin-top:6px">${goalChip}${whatIf}</span></td><td class="ours dw">${above}</td></tr>` },
  { name: 'A · One line', why: 'Sparkline alone is the graph button. Goal and What-if are the same height, on the same line as the grade. Nothing removed, just tightened; on a narrow window it can still wrap.',
    row: () => `<tr class="period"><td class="t">2025-2026 S1</td><td class="g">${grade}<span class="inl dw">${sparkBtn('')}${goalChip}${whatIf}</span></td><td class="ours dw">${above}</td></tr>` },
  { name: 'B · Goal lives in "above A"', why: 'The Goal chip goes; the A in "6.25 above A" is the picker. Grade cell: grade, sparkline, What-if. Fits on one line even half-screen. Cost: a stranger may not guess the A is clickable (the dashed underline is the hint).',
    row: () => `<tr class="period"><td class="t">2025-2026 S1</td><td class="g">${grade}<span class="inl dw">${sparkBtn('')}${whatIf}</span></td><td class="ours dw">${aboveGoal}</td></tr>`, goal: true },
  { name: 'C · Schoology\'s grade left alone', why: 'Nothing beside Schoology\'s grade. Our right column carries "6.25 above A ▾" (goal picker) and the sparkline under it. What-if is not on this row at all: you start it by clicking any score. Quietest; relies on the click-a-score hint being found.',
    row: () => `<tr class="period"><td class="t">2025-2026 S1</td><td class="g">${grade}</td><td class="ours dw">${aboveGoal}<div style="margin-top:4px">${sparkBtn('')}</div></td></tr>`, goal: true },
  { name: 'D · A tools line under the grade', why: 'Schoology\'s row untouched; a thin row of ours under it holds everything left to right: sparkline · Goal · What-if, with "above A" at the right end. Always one line, always the same place; the graph opens under it. Costs one short row per class.',
    row: () => `<tr class="period"><td class="t">2025-2026 S1</td><td class="g">${grade}</td><td class="ours"></td></tr><tr class="tools"><td colspan="3" class="dw"><div class="toolbar">${sparkBtn('Graph')}<span class="sep"></span>${goalChip}${whatIf}${above}</div></td></tr>` },
];

function draw() {
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = DRAFTS.map(d => `
    <section class="${d.cls || ''}">
      <p class="label">${d.name}</p>
      <p class="why">${d.why}</p>
      <div class="sgy"><div class="ctitle">Chemistry: Section 3</div>
        <table>${d.row()}${chartRow()}${rest()}</table></div>
    </section>`).join('');
}
document.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-w]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  document.body.classList.toggle('narrow', b.dataset.w === 'narrow');
}));
document.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-g]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  graph = b.dataset.g; draw();
}));
draw();
</script>
</body></html>
