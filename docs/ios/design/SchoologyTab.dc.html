<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Schoology tab</title>

</head>
<body>
<x-dc>
<helmet>

<style>

a{color:#1D5EA8;text-decoration:none}a:hover{color:#164A86}
button{font:inherit;cursor:pointer}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.web{font-family:Helvetica,Arial,sans-serif}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:8px;min-height:49px;color:#5E6670;font-size:10.5px;font-weight:500;position:relative}
.tab svg{width:26px;height:26px}
.tool{width:56px;height:44px;border:0;background:none;color:{{accent}};display:flex;align-items:center;justify-content:center}
.wline{height:9px;border-radius:2px;background:#DDDDDD}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Instrument Sans', system-ui, sans-serif; color: #1F2429; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <div style="padding: 52px 16px 8px; background: rgba(255,255,255,.96); border-bottom: 1px solid #DCE0E5; display: flex; justify-content: center">

      <span style="font-size: 14px; color: #333333">AP Biology</span>

      <div class="wline" style="width: 90%"></div>
      <div class="wline" style="width: 70%"></div>
      <div style="align-self: flex-start; padding: 8px 14px; border: 1px solid #CCCCCC; border-radius: 3px; font-size: 13px; color: #333333; background: #F7F7F7">Submit Assignment</div>

    <div style="margin: 0 14px; background: #FFFFFF; border: 1px solid #DDDDDD; border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 10px">

  <div style="flex: none; background: rgba(255,255,255,.96); border-top: 1px solid #DCE0E5; display: flex; justify-content: space-around; padding: 2px 8px">
    <button class="tool" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>

    </a>
    <a class="tab" href="Grades.dc.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"></path><path d="M4 15l5-5 4 3 7-7"></path></svg>
      Grades
    </a>
    <a class="tab" href="Classes.dc.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>

    <a class="tab" href="SchoologyTab.dc.html" style="color: {{accent}}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"></path></svg>
      Schoology

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1D5EA8","options":["#1D5EA8","#23794A","#6A4BA8","#A8324A"]},"$preview":{"width":390,"height":844}}'>

return { accent: this.props.accent ?? '#1D5EA8' };

}
</script>
