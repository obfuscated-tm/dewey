<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Submit on Schoology</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D5EA8;text-decoration:none}a:hover{color:#164A86}
button{font:inherit;cursor:pointer}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.web{font-family:Helvetica,Arial,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1F2429; font-family: 'Instrument Sans', system-ui, sans-serif; color: #1F2429; position: relative; overflow: hidden">

  <div style="position: absolute; left: 10px; right: 10px; top: 44px; height: 40px; border-radius: 12px 12px 0 0; background: #8E949A"></div>

  <div style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: #FFFFFF; border-radius: 12px 12px 0 0; display: flex; flex-direction: column; overflow: hidden">
    <div style="display: flex; justify-content: center; padding-top: 6px"><span style="width: 36px; height: 5px; border-radius: 3px; background: #C9CED4"></span></div>
    <div style="display: flex; align-items: center; padding: 2px 8px 8px; border-bottom: 1px solid #DCE0E5">
      <a href="Assignment.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 10px; font-size: 17px; font-weight: 600; color: {{accent}}">Done</a>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px">
        <span style="font-size: 14px; font-weight: 600">Schoology</span>
        <span style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: #5E6670">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
          fuhsd.schoology.com
        </span>
      </div>
      <button aria-label="Reload" style="width: 44px; height: 44px; border: 0; background: none; color: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 4v5h-5"></path></svg>
      </button>
    </div>

    <div class="web" style="flex: 1; background: #F2F2F2; display: flex; flex-direction: column; position: relative">
      <div style="height: 44px; background: #FFFFFF; border-bottom: 1px solid #DDDDDD; display: flex; align-items: center; padding: 0 14px; gap: 10px">
        <span style="width: 22px; height: 22px; border-radius: 4px; background: #0677BA"></span>
        <span style="font-size: 14px; color: #333333">Chemistry H</span>
      </div>
      <div style="margin: 14px; background: #FFFFFF; border: 1px solid #DDDDDD; border-radius: 4px; display: flex; flex-direction: column">
        <div style="padding: 12px 14px; border-bottom: 1px solid #DDDDDD; font-size: 16px; font-weight: 700; color: #333333">Submit Assignment</div>
        <div style="display: flex; border-bottom: 1px solid #DDDDDD; font-size: 13px; color: #0677BA">
          <span style="padding: 10px 14px; border-bottom: 2px solid #0677BA; color: #333333; font-weight: 700">Upload</span>
          <span style="padding: 10px 14px">Create</span>
          <span style="padding: 10px 14px">Resources</span>
        </div>
        <div style="margin: 14px; height: 120px; border: 2px dashed #CCCCCC; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #666666; font-size: 13px">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"></path><path d="M6 10l6-6 6 6"></path><path d="M4 20h16"></path></svg>
          Attach a file
        </div>
        <div style="margin: 0 14px 10px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #F7F7F7; border: 1px solid #E5E5E5; border-radius: 3px; font-size: 13px; color: #333333">
          <span style="width: 14px; height: 16px; background: #B0B0B0; border-radius: 2px"></span>Worksheet 2.2 scan.pdf
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px 14px">
          <span style="padding: 8px 14px; border: 1px solid #CCCCCC; border-radius: 3px; font-size: 13px; color: #333333; background: #FFFFFF">Cancel</span>
          <span style="padding: 8px 14px; border-radius: 3px; font-size: 13px; color: #FFFFFF; background: #0677BA; font-weight: 700">Submit</span>
        </div>
      </div>
      <div style="padding: 0 18px; font-size: 12px; color: #777777">Schoology's own page, inside the app. Your login is shared.</div>

      <div style="position: absolute; left: 12px; right: 12px; bottom: 40px; background: #1F2429; color: #FFFFFF; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; font-family: 'Instrument Sans', system-ui, sans-serif">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #23794A; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 15px; font-weight: 600">Submitted on Schoology</span>
          <span style="font-size: 12.5px; color: #C9CED4">Cleared from To Do and neo-plan</span>
        </span>
        <a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 4px; color: #9CC3F0; font-size: 14px; font-weight: 600">Back</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1D5EA8","options":["#1D5EA8","#23794A","#6A4BA8","#A8324A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#1D5EA8' };
}
}
</script>
</body>
</html>
