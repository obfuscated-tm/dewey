# XcodeGen spec. Run `xcodegen generate` here; Dewey.xcodeproj is generated
# and gitignored. The bundle ID is fixed forever (free Apple account: 10 new
# IDs a week, docs/ios/IOS-APP.md rule 5): never change PRODUCT_BUNDLE_IDENTIFIER.
name: Dewey
options:
  bundleIdPrefix: com.owenleung
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dewey:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources/engine.js
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: App/Resources/engine.js
        buildPhase: resources
        optional: true
      - path: Shared
    dependencies:
      - target: DeweyWidgets
    entitlements:
      path: App/Dewey.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.owenleung.classwork
    preBuildScripts:
      - name: Bundle engine.js
        script: |
          if [ -x "${SRCROOT}/node_modules/.bin/esbuild" ]; then
            "${SRCROOT}/scripts/build-engine.sh"
          else
            echo "warning: esbuild not installed (npm install in ios/); using the committed App/Resources/engine.js"
          fi
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/App/Resources/engine.js
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owenleung.classwork
        PRODUCT_NAME: Dewey
        INFOPLIST_KEY_CFBundleDisplayName: Dewey
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "To scan homework into a Schoology submission, or the barcode on your student ID card."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "To attach photos to a Schoology submission."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZQXMDTS7ZC
  # Widgets + Live Activity. Second bundle ID (an extension's must sit under
  # the app's); like the app's, never change it.
  DeweyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Dewey
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/DeweyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.owenleung.classwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owenleung.classwork.widgets
        PRODUCT_NAME: DeweyWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZQXMDTS7ZC
        SKIP_INSTALL: YES
  DeweyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Dewey
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Dewey.app/Dewey
  DeweyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Dewey
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Dewey
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZQXMDTS7ZC
schemes:
  A11yAudit:
    build:
      targets:
        Dewey: all
        DeweyUITests: [test]
    test:
      targets:
        - DeweyUITests
  Dewey:
    build:
      targets:
        Dewey: all
        DeweyTests: [test]
    test:
      targets:
        - DeweyTests
